<header class="header">
  <div class="container header__bar">
    <a routerLink="/" class="header__brand" (click)="closeMenu()">
      <span class="header__brand-mark">N</span>
      <span class="header__brand-text">
        Construcciones<strong>Nexus</strong>
      </span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a routerLink="/contacto" class="btn btn--primary header__cta" (click)="closeMenu()">
        Solicitar presupuesto
      </a>
    </nav>

    <button
      type="button"
      class="header__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú de navegación"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" />
    </button>
  </div>
</header>
